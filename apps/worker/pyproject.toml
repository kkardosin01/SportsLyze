[project]
name = "sportslyze-worker"
version = "0.1.0"
description = "SportsLyze — Worker assíncrono (Celery) para processamento de vídeo"
requires-python = ">=3.11"
dependencies = [
    "celery>=5.4.0",
    "redis>=5.0.0",
    "supabase>=2.7.0",
    "pydantic-settings>=2.4.0",
    "requests>=2.32.0",
    "weasyprint>=62.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
