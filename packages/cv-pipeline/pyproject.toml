[project]
name = "sportslyze-cv-pipeline"
version = "0.1.0"
description = "SportsLyze — Pipeline de visão computacional (detecção, tracking, homografia, OCR, eventos, estatísticas)"
requires-python = ">=3.11"
dependencies = [
    "ultralytics>=8.2.0",
    "opencv-python-headless>=4.10.0",
    "numpy>=1.26.0",
    "supervision>=0.22.0",
    "paddleocr>=2.8.0",
    "paddlepaddle>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
