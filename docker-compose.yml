services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Postgres local só é necessário se você não estiver usando `supabase start`
  # (que já sobe seu próprio Postgres). Descomente se quiser um Postgres
  # standalone para testes fora do stack Supabase.
  # postgres:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_USER: sportslyze
  #     POSTGRES_PASSWORD: sportslyze
  #     POSTGRES_DB: sportslyze
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - redis
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages/cv-pipeline:/app/packages/cv-pipeline
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    env_file: .env
    depends_on:
      - redis
    volumes:
      - ./apps/worker:/app/apps/worker
      - ./packages/cv-pipeline:/app/packages/cv-pipeline
      - worker_media:/tmp/sportslyze
    command: celery -A src.celery_app worker --loglevel=info --concurrency=2

  worker-beat:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    env_file: .env
    depends_on:
      - redis
    volumes:
      - ./apps/worker:/app/apps/worker
    command: celery -A src.celery_app beat --loglevel=info

volumes:
  redis_data:
  worker_media:
